name: Unsigned iPhone package
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: Release containing the audited native build inputs
        required: true
        default: mobile-build-0.13.2
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Download audited build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ inputs.build_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p inputs
          gh release download "$BUILD_TAG" --repo "$REPOSITORY" --pattern '*-iOS-build-inputs.zip' --pattern '*-iOS-build-inputs.zip.sha256' --dir inputs
          cd inputs
          tr -d '\r' < *-iOS-build-inputs.zip.sha256 > inputs.sha256
          shasum -a 256 -c inputs.sha256
          unzip -q '*-iOS-build-inputs.zip' -d ../mobile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install only native plugin build dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --omit=dev
      - name: Compile iPhone device app and package Payload
        working-directory: mobile
        run: npm run build:ios
      - name: Check IPA layout and absence of signing
        working-directory: mobile
        run: |
          unzip -l release/*-unsigned.ipa | grep 'Payload/TUNED.app/Info.plist'
          test -f mobile-build/unsigned-ipa/Payload/TUNED.app/App
          if codesign --verify mobile-build/unsigned-ipa/Payload/TUNED.app 2>/dev/null; then
            echo 'Expected an unsigned device app'
            exit 1
          fi
      - name: Build iOS simulator verification app
        working-directory: mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile-build/simulator CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build > simulator-build.log 2>&1 || { tail -n 100 simulator-build.log; exit 1; }
      - name: Verify native playback and full iPhone viewport
        working-directory: mobile
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" mobile-build/simulator/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" app.tuned.mobile --tuned-verify
          DATA=$(xcrun simctl get_app_container "$DEVICE" app.tuned.mobile data)
          for n in $(seq 1 90); do
            if test -f "$DATA/Documents/ios-verification.json"; then break; fi
            sleep 1
          done
          cp "$DATA/Documents/ios-verification.json" release/ios-verification.json
          xcrun simctl io "$DEVICE" screenshot release/ios-simulator.png
          cat release/ios-verification.json
          python3 -c 'import json; r=json.load(open("release/ios-verification.json")); assert not r.get("error"),r; assert r["secureSession"],r; assert r["rootHeight"] >= r["nativeHeight"] * .95,r; assert abs(r["rootWidth"]-r["nativeWidth"]) < 2,r; assert r["playback"]["status"] == "playing",r'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TUNED-iPhone-unsigned
          path: |
            mobile/release/*-unsigned.ipa
            mobile/release/*-unsigned.ipa.sha256
            mobile/release/ios-verification.json
            mobile/release/ios-simulator.png
          if-no-files-found: error
